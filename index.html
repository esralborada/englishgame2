<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Center - Fixed Edition</title>
    <style>
        :root { --primary: #3498db; --success: #27ae60; --error: #e74c3c; --accent: #f1c40f; --bg: #ecf0f1; }
        body { font-family: 'Arial Rounded MT Bold', sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-container { background: white; width: 100%; max-width: 700px; border-radius: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); overflow: hidden; border: 4px solid #fff; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .stats { display: flex; justify-content: space-around; background: #2980b9; padding: 10px; font-size: 14px; color: white; }
        .menu-area { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 500px) { .menu-area { grid-template-columns: 1fr; } }
        .topic-btn { background: #fff; border: 2px solid var(--primary); color: var(--primary); padding: 15px; border-radius: 15px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: left; transition: 0.2s; }
        .topic-btn:hover { background: var(--primary); color: white; }
        .game-content { padding: 25px; text-align: center; display: none; }
        .instruction-box { background: #fef9e7; border-left: 5px solid var(--accent); padding: 15px; margin-bottom: 20px; border-radius: 8px; font-size: 15px; font-weight: bold; }
        .action-icon { font-size: 50px; margin: 10px 0; }
        .target-area { min-height: 80px; border: 3px dashed #bdc3c7; border-radius: 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; padding: 15px; background: #fdfdfd; }
        .word-bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .word-card { background: white; border: 2px solid var(--primary); padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold; box-shadow: 0 4px 0 var(--primary); }
        .word-card.used { opacity: 0.2; pointer-events: none; transform: translateY(4px); box-shadow: none; }
        .choice-btn { background: white; border: 3px solid #ddd; padding: 20px; border-radius: 15px; width: 100%; margin: 10px 0; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .choice-btn:hover { border-color: var(--primary); background: #f0f8ff; }
        .btn-control { width: 100%; padding: 18px; border: none; border-radius: 20px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-next { background: var(--success); color: white; display: none; }
        .btn-back { background: #95a5a6; color: white; margin-top: 10px; }
        .feedback { font-size: 22px; font-weight: bold; height: 35px; margin: 10px 0; }
        
        /* Estilo para el pie de página solicitado */
        .footer-tag { margin-top: 30px; padding-top: 15px; border-top: 1px solid #eee; font-size: 14px; color: #7f8c8d; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2 style="margin:0">English Grammar Center</h2>
        <p style="margin:5px 0 0">2nd Grade - Colegio Alborada</p>
    </div>
    
    <div class="stats">
        <span>⭐ Score: <b id="score">0</b></span>
        <span>Unit: <b id="topicLabel">Select a Topic</b></span>
    </div>

    <div id="menuArea" class="menu-area">
        <button class="topic-btn" onclick="startTopic('to_be')">1. TO BE (am/is/are)</button>
        <button class="topic-btn" onclick="startTopic('have_got')">2. HAVE GOT</button>
        <button class="topic-btn" onclick="startTopic('can')">3. CAN / CAN'T</button>
        <button class="topic-btn" onclick="startTopic('continuous')">4. PRESENT CONTINUOUS</button>
        <button class="topic-btn" onclick="startTopic('likes')">5. LIKES & DISLIKES</button>
        <button class="topic-btn" onclick="startTopic('there_is')">6. THERE IS / ARE</button>
        <button class="topic-btn" onclick="startTopic('prepositions')">7. PREPOSITIONS</button>
        <button class="topic-btn" onclick="startTopic('demonstratives')">8. DEMONSTRATIVES</button>
        <button class="topic-btn" onclick="startTopic('imperatives')">9. CLASSROOM ORDERS</button>
        <button class="topic-btn" onclick="startTopic('wh_questions')">10. WH- QUESTIONS</button>
        <button class="topic-btn" onclick="startTopic('routines')">11. DAILY ROUTINES</button>
    </div>

    <div id="gameArea" class="game-content">
        <div id="instruction" class="instruction-box"></div>
        <div id="actionIcon" class="action-icon"></div>
        <div id="exerciseContainer"></div>
        <div id="feedback" class="feedback"></div>
        <button id="nextBtn" class="btn-control btn-next" onclick="loadChallenge()">NEXT CHALLENGE ➔</button>
        <button class="btn-control btn-back" onclick="showMenu()">BACK TO MENU</button>
        
        <div class="footer-tag">ESR | Colegio Alborada</div>
    </div>
</div>

<script>
    const database = {
        to_be: [
            { p: "I am happy", bad: "I are happy" },
            { p: "She is a doctor", bad: "She am a doctor" },
            { p: "They are friends", bad: "They is friends" }
        ],
        have_got: [
            { p: "I have got a cat", bad: "I has got a cat" },
            { p: "She has got a doll", bad: "She have got a doll" }
        ],
        can: [
            { p: "I can swim", bad: "I can swims" },
            { p: "He can't fly", bad: "He can't flies" }
        ],
        continuous: [
            { p: "I am eating now", bad: "I eating now" },
            { p: "She is dancing", bad: "She dancing" },
            { p: "They are running", bad: "They is running" }
        ],
        likes: [
            { p: "I like apples", bad: "I likes apples" },
            { p: "He doesn't like milk", bad: "He don't like milk" }
        ],
        there_is: [
            { p: "There is a pencil", bad: "There are a pencil" },
            { p: "There are four balls", bad: "There is four balls" }
        ],
        prepositions: [
            { p: "It is on the box", bad: "It is on box" },
            { p: "The cat is in the bag", bad: "The cat is in bag" }
        ],
        demonstratives: [
            { p: "This is my pen", bad: "These is my pen" },
            { p: "Those are books", bad: "That are books" }
        ],
        imperatives: [
            { p: "Listen to me", bad: "Listens to me" },
            { p: "Sit down please", bad: "Sits down please" }
        ],
        wh_questions: [
            { p: "Where is my bag", bad: "What is my bag" },
            { p: "Who is that boy", bad: "What is that boy" }
        ],
        routines: [
            { p: "I wash my face", bad: "I wash the face" },
            { p: "I go to bed", bad: "I goes to bed" }
        ]
    };

    let currentTopic = "";
    let score = 0;
    let currentPhraseData = null;
    let userWords = [];

    function showMenu() {
        document.getElementById('menuArea').style.display = 'grid';
        document.getElementById('gameArea').style.display = 'none';
        document.getElementById('topicLabel').innerText = "Select a Topic";
    }

    function startTopic(id) {
        currentTopic = id;
        document.getElementById('menuArea').style.display = 'none';
        document.getElementById('gameArea').style.display = 'block';
        document.getElementById('topicLabel').innerText = id.replace('_',' ').toUpperCase();
        loadChallenge();
    }

    function loadChallenge() {
        const container = document.getElementById('exerciseContainer');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');
        feedback.innerText = "";
        nextBtn.style.display = 'none';
        container.innerHTML = "";
        userWords = [];

        const list = database[currentTopic];
        currentPhraseData = list[Math.floor(Math.random() * list.length)];

        if (Math.random() > 0.5) { setupBuild(container); } 
        else { setupChoice(container); }
    }

    function setupBuild(container) {
        document.getElementById('instruction').innerText = "🏗️ TASK: UNMUDDLE THE SENTENCE";
        document.getElementById('actionIcon').innerText = "🛠️";
        const target = document.createElement('div'); target.className = 'target-area';
        const bank = document.createElement('div'); bank.className = 'word-bank';
        let words = currentPhraseData.p.split(' ');
        let shuffled = [...words].sort(() => Math.random() - 0.5);
        shuffled.forEach(w => {
            let btn = document.createElement('button'); btn.className = 'word-card'; btn.innerText = w;
            btn.onclick = () => {
                userWords.push(w); btn.classList.add('used');
                let s = document.createElement('span'); s.className = 'word-card'; s.innerText = w;
                target.appendChild(s);
                if(userWords.length === words.length) {
                    if(userWords.join(' ') === currentPhraseData.p) success();
                    else { fail("WRONG ORDER! TRY AGAIN"); setTimeout(loadChallenge, 1200); }
                }
            };
            bank.appendChild(btn);
        });
        container.appendChild(target); container.appendChild(bank);
    }

    function setupChoice(container) {
        document.getElementById('instruction').innerText = "🔍 TASK: CHOOSE THE CORRECT SENTENCE";
        document.getElementById('actionIcon').innerText = "⚖️";
        
        let options = [currentPhraseData.p, currentPhraseData.bad];
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === currentPhraseData.p) success();
                else fail("INCORRECT! BE CAREFUL");
            };
            container.appendChild(btn);
        });
    }

    function success() {
        score += 10; document.getElementById('score').innerText = score;
        document.getElementById('feedback').innerHTML = "<span style='color:var(--success)'>EXCELLENT! 🌟</span>";
        document.getElementById('nextBtn').style.display = 'block';
        speak(currentPhraseData.p);
    }

    function fail(m) { document.getElementById('feedback').innerHTML = `<span style='color:var(--error)'>${m} ❌</span>`; }

    function speak(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'en-US'; m.rate = 0.8;
        window.speechSynthesis.speak(m);
    }
</script>
</body>
</html>
